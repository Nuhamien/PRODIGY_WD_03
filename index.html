<!DOCTYPE html>
<html lang="en">
    <head>
        <title>Tic tac toe game</title>
        <link rel="stylesheet" href="index.css">
        <meta name="viewport" content="width=device-width, initial-scale=1">
    </head>
    <body>
        <h1>
            Tic Tac Toe Game
        </h1>
        <p>
            A timeless battle of Xs and 
            Os—strategy, fun, and challenge in every move! 
        </p>
        <div id="modeSelection">
            <button id="playWithAi" onclick="selectMode('AI')">Play With AI</button>
            <button id="playWithHuman" onclick="selectMode('Human')">Play with your buddy</button>
        </div>
        <script src="script.js"></script>
    </body>
    </html>
